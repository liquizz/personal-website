name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]  
  workflow_dispatch:

jobs:
  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write

  build-and-deploy:
    needs: security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          # Full history: scripts/prerender.mjs reads the last content commit date for sitemap lastmod.
          fetch-depth: 0
        
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build
        run: npm run build
        
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
