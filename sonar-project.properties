# SonarQube project configuration
# Project key/name must match the project created on the SonarQube server.
sonar.projectKey=personal-website
sonar.projectName=personal-website
sonar.projectVersion=1.0

sonar.sources=src,scripts,index.html
sonar.exclusions=**/node_modules/**,dist/**,dist-ssr/**,public/**,coverage/**,**/*.min.js
sonar.sourceEncoding=UTF-8

# No test suite or coverage report is generated yet.
# Once tests exist, add e.g.:
# sonar.tests=src
# sonar.javascript.lcov.reportPaths=coverage/lcov.info
